services:
  # The ShortlinkManager service that contains core logic.
  shortlink_manager.shortlink_manager:
    class: Drupal\shortlink_manager\ShortlinkManager
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@messenger'
      - '@path_alias.manager'
      - '@path.validator'
      - '@logger.channel.shortlink_manager'
  logger.channel.shortlink_manager:
    parent: logger.channel_base
    arguments: ['shortlink_manager']
  shortlink_manager.qr_generator:
    class: Drupal\shortlink_manager\ShortlinkQrGenerator
    arguments:
      - '@config.factory'
  shortlink_manager.click_tracker:
    class: Drupal\shortlink_manager\ShortlinkClickTracker
    arguments:
      - '@database'
      - '@config.factory'
      - '@datetime.time'
      - '@state'
  shortlink_manager.utm_resolver:
    class: Drupal\shortlink_manager\ShortlinkUtmResolver
    arguments:
      - '@token'
      - '@entity_type.manager'
  shortlink_manager.stats:
    class: Drupal\shortlink_manager\ShortlinkStats
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@shortlink_manager.utm_resolver'
      - '@shortlink_manager.click_tracker'
  shortlink_manager.health_checker:
    class: Drupal\shortlink_manager\ShortlinkHealthChecker
    arguments:
      - '@entity_type.manager'
      - '@path.validator'
      - '@http_client'
  shortlink_manager.route_subscriber:
    class: Drupal\shortlink_manager\Routing\ShortlinkRouteSubscriber
    arguments: [ '@config.factory' ]
    tags:
      - { name: event_subscriber }
